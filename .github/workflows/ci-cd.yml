name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REPO_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Repo-level checks: seeds, i18n, schema parse (no database)
  # ---------------------------------------------------------------------------
  checks:
    name: Seeds · i18n · schema parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install check tooling
        run: pip install --quiet jsonschema pglast
      - name: make check
        run: make check

  # ---------------------------------------------------------------------------
  # 2. API tests: unit (no DB) + integration + smoke.sql against Postgres 16/pgvector
  # ---------------------------------------------------------------------------
  test:
    name: API tests
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: ./api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finassis
          POSTGRES_PASSWORD: finassis
          POSTGRES_DB: finassis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finassis -d finassis"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      FINASSIS_DATABASE_URL: postgresql://finassis:finassis@localhost:5432/finassis
      FINASSIS_REDIS_URL: redis://localhost:6379/0
      FINASSIS_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: api/pyproject.toml
      - name: Install package + dev deps
        run: uv venv .venv && uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests
      - name: Unit tests
        run: .venv/bin/python -m pytest tests/unit -q
      - name: Schema + smoke.sql against real Postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$FINASSIS_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE finassis_smoke;"
          psql "postgresql://finassis:finassis@localhost:5432/finassis_smoke" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql "postgresql://finassis:finassis@localhost:5432/finassis_smoke" -v ON_ERROR_STOP=1 -q -f db/smoke.sql
      - name: Migrate + seed + bootstrap (the real startup path)
        run: |
          .venv/bin/finassis migrate
          psql "$FINASSIS_DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | tee tables.txt
          test "$(cat tables.txt)" -gt 40 || (echo "migration did not create tables" && exit 1)
          .venv/bin/finassis seed
          .venv/bin/finassis partitions
          .venv/bin/finassis bootstrap | tee bootstrap.log
          grep -q "BOOTSTRAP: admin API key" bootstrap.log
      - name: Integration tests
        run: .venv/bin/python -m pytest tests/integration -q -m integration
      - name: API boots and answers /health
        run: |
          (.venv/bin/uvicorn finassis.api.app:create_app --factory --port 8000 > api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && break || sleep 1; done
          curl -sf localhost:8000/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf localhost:8000/metrics | grep -q finassis_http_requests_total
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api/api.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build & push Docker image (same tag scheme as wedding-planner)
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      repo_name: ${{ steps.repo.outputs.name }}
      deploy_tag: ${{ steps.deploy_tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build (and push on push events)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo.outputs.name }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:buildcache,mode=max', secrets.DOCKERHUB_USERNAME, steps.repo.outputs.name) || '' }}

      - name: Set deploy tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: deploy_tag
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          DEPLOY_TAG=""
          while IFS= read -r tag; do
            TAG_NAME="${tag##*:}"
            if echo "$TAG_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              DEPLOY_TAG="$TAG_NAME"
              break
            fi
            LAST_TAG="$TAG_NAME"
          done <<< "$TAGS"
          if [ -z "$DEPLOY_TAG" ]; then
            DEPLOY_TAG="${LAST_TAG:-latest}"
          fi
          echo "tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "Deploy tag: $DEPLOY_TAG"

  # ---------------------------------------------------------------------------
  # 4. Deploy hook (same contract as wedding-planner: ?repo=&name=&tag=)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Trigger deployment
        run: |
          if [[ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]]; then
            curl -fsS -X GET "${{ secrets.DEPLOY_HOOK_URL }}?repo=${{ secrets.DOCKERHUB_USERNAME }}&name=${{ needs.build.outputs.repo_name }}&tag=${{ needs.build.outputs.deploy_tag }}"
          else
            echo "No deploy webhook URL set, skipping."
          fi
