[project]
name = "finassis"
version = "0.1.0"
description = "Finassis — ledger-first personal-finance backend built to be the financial memory an AI agent reads from"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "alembic>=1.13",
  "sqlalchemy>=2.0",          # alembic runtime only
  "psycopg[binary]>=3.1",     # sync driver for alembic (multi-statement schema.sql)
  "redis>=5.0",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "pglast>=6.0",
]

[project.scripts]
finassis = "finassis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finassis"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "RUF"]
ignore = ["S101", "S608", "RUF012", "B008", "UP017", "E731", "RUF001", "RUF002", "RUF003", "S104", "T201", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S105", "S106"]
"alembic/**" = ["E501"]
"src/finassis/domain/**" = ["E501"]
"src/finassis/jobs/**" = ["E501"]
"src/finassis/api/routers/**" = ["E501"]
"src/finassis/channels/**" = ["E501"]
"src/finassis/client/**" = ["E501"]
"src/finassis/api/**" = ["E501"]
"src/finassis/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs DATABASE_URL"]
