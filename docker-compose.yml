# Full stack. Local dev builds the image: `docker compose up --build` (or `make up`).
# Deploy pulls the CI-built image instead: `FINASSIS_IMAGE=lanhlungbang/finassis:<tag> docker compose up -d --no-build`
# (image tags follow .github/workflows/ci-cd.yml: latest on main, <branch>, <sha>, vX.Y.Z on release tags).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres            # cluster superuser: only the init script uses it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # the init script creates the app database/role itself; POSTGRES_DB is just the maintenance db
      FINASSIS_DB_NAME: ${FINASSIS_DB_NAME:-finassis}
      FINASSIS_DB_USER: ${FINASSIS_DB_USER:-finassis_app}
      FINASSIS_DB_PASSWORD: ${FINASSIS_DB_PASSWORD:-finassis_app}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - timezone=UTC
      - -c
      - jit=off
      - -c
      - log_min_duration_statement=500ms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs ONCE on an empty volume as superuser: app role + app database + extensions inside it.
      # On an existing volume run it by hand: docker compose exec postgres bash /docker-entrypoint-initdb.d/01-finassis.sh
      - ./api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  api:
    image: ${FINASSIS_IMAGE:-lanhlungbang/finassis:latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["api"]
    env_file: [.env]
    environment:
      # one non-superuser role; RLS scoping is per transaction (app.user_id / app.bypass_rls)
      FINASSIS_DATABASE_URL: postgresql://${FINASSIS_DB_USER:-finassis_app}:${FINASSIS_DB_PASSWORD:-finassis_app}@postgres:5432/${FINASSIS_DB_NAME:-finassis}
      FINASSIS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ${FINASSIS_IMAGE:-lanhlungbang/finassis:latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["worker"]
    env_file: [.env]
    environment:
      FINASSIS_DATABASE_URL: postgresql://${FINASSIS_DB_USER:-finassis_app}:${FINASSIS_DB_PASSWORD:-finassis_app}@postgres:5432/${FINASSIS_DB_NAME:-finassis}
      FINASSIS_REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy

# Observability: the API exposes Prometheus metrics at /metrics. Prometheus + Grafana are not part of the
# stack yet; docs/tech/06-operations.md §"Metrics" has the compose snippet to add when needed.

volumes:
  pgdata:
