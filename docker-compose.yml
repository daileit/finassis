# Full stack. Local dev builds the image: `docker compose up --build` (or `make up`).
# Deploy pulls the CI-built image instead: `FINASSIS_IMAGE=lanhlungbang/finassis:<tag> docker compose up -d --no-build`
# (image tags follow .github/workflows/ci-cd.yml: latest on main, <branch>, <sha>, vX.Y.Z on release tags).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finassis
      POSTGRES_PASSWORD: finassis
      POSTGRES_DB: finassis
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - timezone=UTC
      - -c
      - jit=off
      - -c
      - log_min_duration_statement=500ms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finassis -d finassis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  api:
    image: ${FINASSIS_IMAGE:-lanhlungbang/finassis:latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["api"]
    env_file: [.env]
    environment:
      FINASSIS_DATABASE_URL: postgresql://finassis:finassis@postgres:5432/finassis
      FINASSIS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ${FINASSIS_IMAGE:-lanhlungbang/finassis:latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["worker"]
    env_file: [.env]
    environment:
      FINASSIS_DATABASE_URL: postgresql://finassis:finassis@postgres:5432/finassis
      FINASSIS_REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy

# Observability: the API exposes Prometheus metrics at /metrics. Prometheus + Grafana are not part of the
# stack yet; docs/tech/06-operations.md §"Metrics" has the compose snippet to add when needed.

volumes:
  pgdata:
